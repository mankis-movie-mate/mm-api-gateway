http:
  routers:
    # Traefik Dashboard
    dashboard:
      rule: "PathPrefix(`${MOVIE_MATE_BASE_PATH}/traefik`)"
      service: api@internal
      entryPoints:
        - internal
      middlewares:
        - oauth-forwardauth@file

  middlewares:
    dapr-rewrite:
      replacePathRegex:
        regex: "^/([^/]+)(/.*)?"
        replacement: "/v1.0/invoke/${1}/method${2}"
        # Example: /mm-user-service/profile → /v1.0/invoke/mm-user-service/method/profile
    jwt-forwardauth:
      forwardAuth:
        address: "${MOVIE_MATE_USER_SERVICE_TOKEN_VALIDATION_URL}"
        trustForwardHeader: true
        authResponseHeaders:
          - X-User-Id
          - X-User-Username
          - X-User-Email
          - X-User-Roles
          - Authorization
    oauth-forwardauth:
      forwardAuth:
        address: "${MOVIE_MATE_OAUTH_URL}"
        trustForwardHeader: true
        authRequestHeaders:
          - X-Forwarded-Host
          - X-Forwarded-Proto
          - X-Forwarded-Port
          - X-Forwarded-Uri
          - X-Original-Uri
        authResponseHeaders:
          - X-Auth-Request-Email
          - X-Auth-Request-User
          - Authorization


