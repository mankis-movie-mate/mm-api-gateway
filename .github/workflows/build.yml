name: Build and push mm-api-gateway

on:
  push:
    branches:
      - main
      - dev/release-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/mm-api-gateway:latest .

      - name: Push docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/mm-api-gateway:latest

      - name: Trigger redeploy
        uses: peter-evans/repository-dispatch@v1
        with:
          repository: mankis-movie-mate/mm-infrastructure
          event-type: api-gateway-builded
          client-payload: '{"service": "mm-api-gateway", "tag": "latest"}'
          token: ${{ secrets.MM_TOKEN }}